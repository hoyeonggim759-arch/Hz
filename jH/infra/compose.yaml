services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_saas}
      POSTGRES_USER: ${POSTGRES_USER:-saas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?Set MIGRATION_DB_USER in .env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 200
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-secure_saas}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      LICENSE_PEPPER: ${LICENSE_PEPPER:?Set LICENSE_PEPPER in .env}
      APP_DATA_KEY: ${APP_DATA_KEY:?Set APP_DATA_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      API_PORT: 4000
      NODE_ENV: production
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks: [frontend, database]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 200
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    networks: [frontend]

  migrate:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${MIGRATION_DB_USER}:${MIGRATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-secure_saas}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:deploy"]
    networks: [database]

  bootstrap:
    profiles: ["ops"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-secure_saas}?schema=public
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:?Set ADMIN_LOGIN_ID in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/seed-admin.cjs"]
    networks: [database]

volumes:
  pgdata:

networks:
  frontend:
    driver: bridge
  database:
    internal: true
