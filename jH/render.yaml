
services:
  # NestJS 后端
  - type: web
    name: jinqsms-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run db:generate && npm run build:api
    startCommand: npm run db:deploy && npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_PEPPER
        generateValue: true
      - key: APP_DATA_KEY
        generateValue: true
      - key: ADMIN_LOGIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Next.js 前端
  - type: web
    name: jinqsms-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api

